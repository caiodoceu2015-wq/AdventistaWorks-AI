<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Novo Site</title>
    <style>
        /* Estilos CSS para o visual da página */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --accent-color: #0070f3;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f4f7f6;
            --card-bg: #2a2a2a;
            --accent-color: #3291ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        [data-theme="dark"] p {
            color: #aaa;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Olá, Mundo! 👋</h1>
        <p>Este é o seu novo arquivo <strong>index.html</strong>. O código já está estruturado, estilizado e pronto para você começar a editar.</p>
        
        <!-- Botão que aciona a função JavaScript -->
        <button class="btn" id="themeToggle">Mudar Tema</button>
    </div>

    <script>
        /* Script JavaScript para interatividade */
        const toggleButton = document.getElementById('themeToggle');
        
        toggleButton.addEventListener('click', () => {
            // Verifica o tema atual e alterna
            const currentTheme = document.body.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                document.body.removeAttribute('data-theme');
                toggleButton.textContent = 'Modo Escuro';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                toggleButton.textContent = 'Modo Claro';
            }
        });
    </script>
</body>
</html>
